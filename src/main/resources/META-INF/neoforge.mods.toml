modLoader = "javafml"
loaderVersion = "[1,)"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
${icon_key} = "assets/dreamtvs/icon.png"
description = '''${mod_description}'''

[[mixins]]
config = "dreamtvs.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_compat}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "dreamdisplays"
type = "required"
versionRange = "[${dreamdisplays_version},)"
ordering = "AFTER"
side = "BOTH"
